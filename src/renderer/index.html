<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Solo permitimos recursos locales: la ventana no carga nada de internet -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Globito de texto (arriba). Se oculta solo después de unos segundos o con un clic. -->
  <div id="bubble" class="hidden"></div>

  <!--
    Clawd dibujado en pixel art con SVG (cada <rect> es un píxel o bloque).
    Grilla de 32x26 (el doble que antes) para que la carita tenga detalle.
    - #clawd tiene una clase de ANIMACIÓN (idle, talking, excited…)
    - y un atributo data-face con la CARA: normal, happy (^ ^), squint (> <) o angry (enojado).
    - y data-accessory con el ACCESORIO (los catálogos están en src/presets.js).
    style.css muestra solo el grupo de ojos que corresponde a la cara.
  -->
  <div id="clawd" class="idle" data-face="normal" data-accessory="ninguno" title="Doble clic: que opine ahora · Clic derecho: menú">
    <svg viewBox="0 0 32 26" shape-rendering="crispEdges">
      <!-- Laptop: va primero para quedar detrás de Clawd. La tapa tiene 3 dibujos
           (cerrada, a medio abrir, abierta) que style.css va alternando. -->
      <g class="laptop">
        <rect class="lap-base" x="-6" y="22" width="12" height="2" />
        <rect class="lap-top" x="-6" y="22" width="12" height="1" />
        <g class="lid lid-closed"><rect x="-6" y="21" width="12" height="1" /></g>
        <g class="lid lid-half">
          <rect x="-9" y="21" width="3" height="1" /><rect x="-12" y="20" width="3" height="1" /><rect x="-15" y="19" width="3" height="1" />
        </g>
        <g class="lid lid-open">
          <rect x="-7" y="20" width="2" height="2" /><rect x="-8" y="18" width="2" height="2" />
          <rect x="-9" y="16" width="2" height="2" /><rect x="-10" y="14" width="2" height="2" />
          <rect x="-11" y="12" width="2" height="2" />
        </g>
      </g>
      <g class="body">
        <rect x="4" y="4" width="24" height="14" />   <!-- cuerpo -->
        <rect x="0" y="8" width="4" height="4" />     <!-- bracito izq -->
        <rect x="28" y="8" width="4" height="4" />    <!-- bracito der -->
      </g>
      <g class="legs">
        <rect x="6" y="18" width="2" height="6" />
        <rect x="10" y="18" width="2" height="6" />
        <rect x="20" y="18" width="2" height="6" />
        <rect x="24" y="18" width="2" height="6" />
      </g>

      <!-- Ojos normales: dos puntitos que parpadean -->
      <g class="eyes face-normal">
        <rect x="10" y="8" width="2" height="3" />
        <rect x="20" y="8" width="2" height="3" />
      </g>
      <!-- Ojos felices: ^ ^ -->
      <g class="eyes face-happy">
        <rect x="9" y="10" width="1" height="1" /><rect x="10" y="9" width="2" height="1" /><rect x="12" y="10" width="1" height="1" />
        <rect x="19" y="10" width="1" height="1" /><rect x="20" y="9" width="2" height="1" /><rect x="22" y="10" width="1" height="1" />
      </g>
      <!-- Ojos apretados: > < -->
      <g class="eyes face-squint">
        <rect x="9" y="7" width="1" height="1" /><rect x="10" y="8" width="1" height="1" /><rect x="11" y="9" width="1" height="1" />
        <rect x="10" y="10" width="1" height="1" /><rect x="9" y="11" width="1" height="1" />
        <rect x="22" y="7" width="1" height="1" /><rect x="21" y="8" width="1" height="1" /><rect x="20" y="9" width="1" height="1" />
        <rect x="21" y="10" width="1" height="1" /><rect x="22" y="11" width="1" height="1" />
      </g>

      <!-- Ojos enojados: cejas en diagonal hacia el centro + ojito abajo -->
      <g class="eyes face-angry">
        <rect x="8" y="7" width="1" height="1" /><rect x="9" y="8" width="1" height="1" /><rect x="10" y="9" width="2" height="1" />
        <rect x="10" y="10" width="2" height="2" />
        <rect x="23" y="7" width="1" height="1" /><rect x="22" y="8" width="1" height="1" /><rect x="20" y="9" width="2" height="1" />
        <rect x="20" y="10" width="2" height="2" />
      </g>

      <!-- cachetes rosados -->
      <g class="cheeks">
        <rect x="6" y="12" width="3" height="1" />
        <rect x="23" y="12" width="3" height="1" />
      </g>
      <!-- boquita enojada: la sonrisa al revés -->
      <g class="mouth-angry">
        <rect x="14" y="14" width="1" height="1" />
        <rect x="15" y="13" width="2" height="1" />
        <rect x="17" y="14" width="1" height="1" />
      </g>
      <!-- boquita chiquita: una sonrisa de 4 píxeles -->
      <g class="mouth">
        <rect x="14" y="12" width="1" height="1" />
        <rect x="15" y="13" width="2" height="1" />
        <rect x="17" y="12" width="1" height="1" />
      </g>
      <!-- Accesorios: style.css muestra el de data-accessory. Van después de la cara, para
           quedar encima, y fuera de .body, porque la despedida usa el orden de sus rect. -->
      <g class="acc acc-gorrito"><rect x="9" y="1" width="14" height="3" fill="#c94f4f" /><rect x="8" y="3" width="16" height="1" fill="#f4ece4" /><rect x="15" y="-1" width="2" height="2" fill="#f4ece4" /></g>
      <g class="acc acc-lentes"><rect x="9" y="8" width="4" height="3" fill="#ffffff" fill-opacity=".3" /><rect x="8" y="7" width="6" height="1" fill="#1f1a17" /><rect x="8" y="11" width="6" height="1" fill="#1f1a17" /><rect x="8" y="8" width="1" height="3" fill="#1f1a17" /><rect x="13" y="8" width="1" height="3" fill="#1f1a17" /><rect x="19" y="8" width="4" height="3" fill="#ffffff" fill-opacity=".3" /><rect x="18" y="7" width="6" height="1" fill="#1f1a17" /><rect x="18" y="11" width="6" height="1" fill="#1f1a17" /><rect x="18" y="8" width="1" height="3" fill="#1f1a17" /><rect x="23" y="8" width="1" height="3" fill="#1f1a17" /><rect x="14" y="8" width="4" height="1" fill="#1f1a17" /></g>
      <g class="acc acc-corona"><rect x="10" y="2" width="12" height="2" fill="#f2c14e" /><rect x="10" y="0" width="2" height="2" fill="#f2c14e" /><rect x="15" y="-1" width="2" height="3" fill="#f2c14e" /><rect x="20" y="0" width="2" height="2" fill="#f2c14e" /><rect x="15" y="2" width="2" height="1" fill="#c94f4f" /></g>
      <g class="acc acc-mono"><rect x="5" y="2" width="3" height="3" fill="#d6336c" /><rect x="8" y="3" width="2" height="1" fill="#a61e4d" /><rect x="10" y="2" width="3" height="3" fill="#d6336c" /></g>
      <g class="acc acc-audifonos"><rect x="5" y="1" width="22" height="1" fill="#2f2a27" /><rect x="4" y="2" width="1" height="2" fill="#2f2a27" /><rect x="27" y="2" width="1" height="2" fill="#2f2a27" /><rect x="3" y="4" width="2" height="4" fill="#4a6fa5" /><rect x="27" y="4" width="2" height="4" fill="#4a6fa5" /></g>
      <g class="acc acc-brote"><rect x="15" y="0" width="2" height="4" fill="#3f9d4a" /><rect x="12" y="-1" width="3" height="2" fill="#6cc070" /><rect x="17" y="-2" width="3" height="2" fill="#6cc070" /></g>
      <!-- Modo navideño (ver style.css): Santa = gorro caído + barba; lana = gorro con pompón
           (los mitones son los bracitos pintados de rojo). El gorro solo va si no lleva otro sombrero. -->
      <g class="xmas xmas-santa"><g class="xmas-hat"><rect x="8" y="1" width="16" height="3" fill="#c94f4f" /><rect x="11" y="-1" width="10" height="2" fill="#c94f4f" /><rect x="19" y="-1" width="5" height="2" fill="#c94f4f" /><rect x="23" y="0" width="2" height="2" fill="#c94f4f" /><rect x="24" y="1" width="3" height="3" fill="#f4ece4" /><rect x="7" y="3" width="18" height="2" fill="#f4ece4" /></g><rect x="9" y="14" width="5" height="1" fill="#f4ece4" /><rect x="18" y="14" width="5" height="1" fill="#f4ece4" /><rect x="8" y="15" width="16" height="2" fill="#f4ece4" /><rect x="10" y="17" width="12" height="2" fill="#f4ece4" /><rect x="13" y="19" width="6" height="1" fill="#f4ece4" /></g>
      <g class="xmas xmas-lana"><g class="xmas-hat"><rect x="8" y="0" width="16" height="4" fill="#c94f4f" /><rect x="8" y="1" width="16" height="1" fill="#9e3434" /><rect x="7" y="3" width="18" height="2" fill="#f4ece4" /><rect x="9" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="13" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="18" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="22" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="14" y="-3" width="4" height="3" fill="#f4ece4" /></g></g>
      <!-- Clawd usando la laptop: otro dibujo entero, de costado y agachado, con patitas
           cortas y los dos bracitos hacia adelante. Solo se ve con la clase .working. -->
      <g class="pose">
        <rect class="fur" x="7" y="4" width="24" height="8" />
        <rect class="fur" x="3" y="12" width="28" height="9" />
        <rect class="shade" x="26" y="4" width="5" height="17" />
        <rect class="arm arm-back" x="1" y="15" width="7" height="3" />
        <rect class="arm arm-front" x="1" y="12" width="7" height="3" />
        <rect class="pose-eye" x="7" y="8" width="2" height="3" />
        <rect class="pose-eye" x="18" y="8" width="2" height="3" />
        <rect class="pose-leg" x="8" y="21" width="3" height="3" />
        <rect class="pose-leg" x="13" y="21" width="3" height="3" />
        <rect class="pose-leg" x="20" y="21" width="3" height="3" />
        <rect class="pose-leg" x="25" y="21" width="3" height="3" />
        <!-- los mismos accesorios para esta pose (los lentes siguen a sus ojos, más a la izquierda) -->
        <g class="acc acc-gorrito" transform="translate(3 0)"><rect x="9" y="1" width="14" height="3" fill="#c94f4f" /><rect x="8" y="3" width="16" height="1" fill="#f4ece4" /><rect x="15" y="-1" width="2" height="2" fill="#f4ece4" /></g>
        <g class="acc acc-lentes"><rect x="6" y="8" width="4" height="3" fill="#ffffff" fill-opacity=".3" /><rect x="5" y="7" width="6" height="1" fill="#1f1a17" /><rect x="5" y="11" width="6" height="1" fill="#1f1a17" /><rect x="5" y="8" width="1" height="3" fill="#1f1a17" /><rect x="10" y="8" width="1" height="3" fill="#1f1a17" /><rect x="17" y="8" width="4" height="3" fill="#ffffff" fill-opacity=".3" /><rect x="16" y="7" width="6" height="1" fill="#1f1a17" /><rect x="16" y="11" width="6" height="1" fill="#1f1a17" /><rect x="16" y="8" width="1" height="3" fill="#1f1a17" /><rect x="21" y="8" width="1" height="3" fill="#1f1a17" /><rect x="11" y="8" width="5" height="1" fill="#1f1a17" /></g>
        <g class="acc acc-corona" transform="translate(3 0)"><rect x="10" y="2" width="12" height="2" fill="#f2c14e" /><rect x="10" y="0" width="2" height="2" fill="#f2c14e" /><rect x="15" y="-1" width="2" height="3" fill="#f2c14e" /><rect x="20" y="0" width="2" height="2" fill="#f2c14e" /><rect x="15" y="2" width="2" height="1" fill="#c94f4f" /></g>
        <g class="acc acc-mono" transform="translate(3 0)"><rect x="5" y="2" width="3" height="3" fill="#d6336c" /><rect x="8" y="3" width="2" height="1" fill="#a61e4d" /><rect x="10" y="2" width="3" height="3" fill="#d6336c" /></g>
        <g class="acc acc-audifonos" transform="translate(3 0)"><rect x="5" y="1" width="22" height="1" fill="#2f2a27" /><rect x="4" y="2" width="1" height="2" fill="#2f2a27" /><rect x="27" y="2" width="1" height="2" fill="#2f2a27" /><rect x="3" y="4" width="2" height="4" fill="#4a6fa5" /><rect x="27" y="4" width="2" height="4" fill="#4a6fa5" /></g>
        <g class="acc acc-brote" transform="translate(3 0)"><rect x="15" y="0" width="2" height="4" fill="#3f9d4a" /><rect x="12" y="-1" width="3" height="2" fill="#6cc070" /><rect x="17" y="-2" width="3" height="2" fill="#6cc070" /></g>
        <g class="xmas xmas-santa"><g class="xmas-hat" transform="translate(3 0)"><rect x="8" y="1" width="16" height="3" fill="#c94f4f" /><rect x="11" y="-1" width="10" height="2" fill="#c94f4f" /><rect x="19" y="-1" width="5" height="2" fill="#c94f4f" /><rect x="23" y="0" width="2" height="2" fill="#c94f4f" /><rect x="24" y="1" width="3" height="3" fill="#f4ece4" /><rect x="7" y="3" width="18" height="2" fill="#f4ece4" /></g><rect x="6" y="12" width="14" height="2" fill="#f4ece4" /><rect x="8" y="14" width="10" height="2" fill="#f4ece4" /><rect x="10" y="16" width="6" height="1" fill="#f4ece4" /></g>
        <g class="xmas xmas-lana"><g class="xmas-hat" transform="translate(3 0)"><rect x="8" y="0" width="16" height="4" fill="#c94f4f" /><rect x="8" y="1" width="16" height="1" fill="#9e3434" /><rect x="7" y="3" width="18" height="2" fill="#f4ece4" /><rect x="9" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="13" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="18" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="22" y="3" width="1" height="2" fill="#d9cfc4" /><rect x="14" y="-3" width="4" height="3" fill="#f4ece4" /></g></g>
      </g>
    </svg>
    <!-- "Zzz" cuando duerme (pausado) y "..." cuando piensa -->
    <span class="zzz">z<sup>z</sup></span>
    <span class="dots">···</span>
  </div>

  <!-- Nieve del modo navideño: cae solo alrededor de Clawd (los copos los crea renderer.js) -->
  <div id="snow" aria-hidden="true"></div>

  <!-- Contador del modo foco: tomatito + tiempo que queda, al costado de Clawd -->
  <div id="focus-badge" class="hidden"><i></i><span>25:00</span><b class="bar"></b></div>

  <!--
    Menú propio (clic derecho sobre Clawd). Sale al costado de Clawd, del lado
    que tiene espacio. Los iconitos pixel los dibuja renderer.js (ICONS).
  -->
  <div id="menu" class="hidden" role="menu">
    <div class="menu-title">¿qué hacemos?</div>
    <!-- Controles de música: solo aparecen si hay algo sonando (o pausado) -->
    <div class="music-row hidden">
      <button data-action="music-prev" data-icon="prev" data-keep title="Anterior"><i></i></button>
      <button data-action="music-toggle" data-icon="pause" data-keep title="Play / pausa"><i></i></button>
      <button data-action="music-next" data-icon="next" data-keep title="Siguiente"><i></i></button>
      <span class="song"></span>
    </div>
    <button data-action="pause" data-icon="moon" role="menuitem"><i></i><span>Dormir un rato</span></button>
    <button data-action="capture" data-icon="eye" role="menuitemcheckbox"><i></i><span>Ver pantalla</span><b class="switch"></b></button>
    <button data-action="autostart" data-icon="power" role="menuitemcheckbox"><i></i><span>Abrir al iniciar</span><b class="switch"></b></button>
    <button data-action="christmas" data-icon="snow" role="menuitemcheckbox"><i></i><span>Navidad</span><b class="switch"></b></button>
    <button data-action="poke" data-icon="chat" role="menuitem"><i></i><span>Opiná ahora</span></button>
    <button data-action="focus" data-icon="tomato" role="menuitem"><i></i><span>Modo foco</span></button>
    <button data-action="summary" data-icon="chart" role="menuitem"><i></i><span>Terminé por hoy</span></button>
    <hr>
    <button data-action="guardlog" data-icon="shield" role="menuitem"><i></i><span>Registro de seguridad</span></button>
    <button data-action="config" data-icon="gear" role="menuitem"><i></i><span>Configuración</span></button>
    <button data-action="quit" data-icon="bye" role="menuitem" class="danger"><i></i><span>Chau, Clawd</span></button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
